name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  PREVIEW_BUCKET: zou-minowa-portfolio-previews

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/checks.yml

  changes:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/actions/build/**'
              - '.github/workflows/preview.yml'
              - '.github/workflows/checks.yml'
              - 'scripts/deploy.sh'

  deploy:
    needs: [quality, changes]
    if: ${{ github.event.action != 'closed' && github.actor != 'dependabot[bot]' && needs.quality.result == 'success' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          site-url: ${{ format('https://pr-{0}.{1}', github.event.number, vars.PREVIEW_BASE_DOMAIN) }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PREVIEW_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Deploy to preview prefix
        run: bash scripts/deploy.sh
        env:
          DEPLOY_BUCKET: ${{ env.PREVIEW_BUCKET }}
          DEPLOY_PREFIX: ${{ format('pr-{0}', github.event.number) }}

      - name: Post preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ format('https://pr-{0}.{1}/', github.event.number, vars.PREVIEW_BASE_DOMAIN) }}
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body "Preview: ${PREVIEW_URL}"

  teardown:
    if: ${{ github.event.action == 'closed' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.PREVIEW_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Delete preview prefix
        env:
          DEPLOY_PREFIX: ${{ format('pr-{0}', github.event.number) }}
        run: |
          aws s3 rm "s3://${PREVIEW_BUCKET}/${DEPLOY_PREFIX}/" --recursive
