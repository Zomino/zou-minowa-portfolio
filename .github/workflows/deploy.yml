name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/actions/build/**"
      - ".github/workflows/deploy.yml"
      - "scripts/deploy.sh"

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/checks.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          site-url: ${{ vars.SITE_URL || format('https://{0}', vars.PRODUCTION_DISTRIBUTION_DOMAIN) }}
          rum-app-monitor-id: ${{ vars.RUM_APP_MONITOR_ID }}
          rum-identity-pool-id: ${{ vars.RUM_IDENTITY_POOL_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: frontend/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - run: bash scripts/deploy.sh

  lighthouse:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Lighthouse report against live site
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ vars.SITE_URL || format('https://{0}', vars.PRODUCTION_DISTRIBUTION_DOMAIN) }}
          uploadArtifacts: true
          temporaryPublicStorage: true
