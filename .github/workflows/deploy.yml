name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - "apps/chat/**"
      - "packages/**"
      - ".github/actions/build/**"
      - ".github/workflows/deploy.yml"
      - "scripts/deploy-frontend.sh"
      - "scripts/chat/**"

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/checks.yml

  build-frontend:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          site-url: ${{ vars.SITE_URL || format('https://{0}', vars.PRODUCTION_DISTRIBUTION_DOMAIN) }}
          rum-app-monitor-id: ${{ vars.RUM_APP_MONITOR_ID }}
          rum-identity-pool-id: ${{ vars.RUM_IDENTITY_POOL_ID }}
          chat-api-url: ${{ vars.CHAT_API_URL }}
          chat-enabled: ${{ vars.CHAT_ENABLED || 'true' }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: apps/frontend/dist

  deploy-frontend:
    needs: [build-frontend, deploy-chat]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: apps/frontend/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - run: bash scripts/deploy-frontend.sh

  build-chat:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: pnpm -F @zou/chat build

      - uses: actions/upload-artifact@v7
        with:
          name: chat-dist
          path: apps/chat/dist

  deploy-chat:
    needs: build-chat
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: chat-dist
          path: apps/chat/dist

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - run: bash scripts/chat/deploy-chat.sh

  lighthouse:
    needs: deploy-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lighthouse report against live site
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ vars.SITE_URL || format('https://{0}', vars.PRODUCTION_DISTRIBUTION_DOMAIN) }}
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
