<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Waveform analytics preview</title>
  <desc id="desc">Abstract preview card with chart visualisation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4" />
      <stop offset="1" stop-color="#bbf7d0" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="28" fill="url(#bg)" />
  <rect x="60" y="60" width="680" height="300" rx="18" fill="#ffffff" />
  <polyline points="100,300 200,200 300,250 400,150 500,180 600,100 700,130" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" />
  <rect x="60" y="390" width="320" height="60" rx="14" fill="#ffffff" />
  <rect x="420" y="390" width="320" height="60" rx="14" fill="#ffffff" />
</svg>
