services:
  dev:
    platform: linux/arm64
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: zou-minowa-portfolio-dev
    user: node
    env_file:
      - ../.env
    ports:
      - "4321:4321"
      - "8080:8080"
    volumes:
      - ..:/workspaces/zou-minowa-portfolio:cached
      - ../.gitconfig:/home/node/.gitconfig
    command: sleep infinity
